# Keeps the top and footer navigation identical on every page.
# On each push to main it runs tools/sync_nav.py; if any page (new or old) is missing a nav link
# or has a stale one, it commits the fix as Dylan Asdale, as this repo's CLAUDE.md requires.
# To change the nav itself, edit TOP_NAV / FOOTER_NAV in tools/sync_nav.py.
name: Sync site navigation

on:
  push:
    branches: [main]
    paths: ["**.html", "tools/sync_nav.py", ".github/workflows/sync-nav.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the shared navigation to every page
        run: python3 tools/sync_nav.py

      - name: Commit and push any fixes
        run: |
          if git diff --quiet; then
            echo "Navigation already in sync."
            exit 0
          fi
          git config user.name "Dylan Asdale"
          git config user.email "dylanasdale@users.noreply.github.com"
          git commit -am "Sync site navigation on every page"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt); retrying."
            sleep 5
          done
          exit 1
